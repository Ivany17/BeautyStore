<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>BeautyStore Cart</title>
</head>
<body>
    <header class="header">
        <h1>Beauty Store 🛒</h1>
        
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search products...">
            <button id="searchBtn">Search</button>
            <button id="clearBtn">Clear</button>
        </div>
        
        <div class="nav-group">
            <div class="dropdown">
                <button>Categories</button>
                <div class="dropdown-content">
                    <a href="#" data-category="All">All Categories</a>
                    <a href="#" data-category="Body Care">Body Care</a>
                    <a href="#" data-category="Hair Care">Hair Care</a>
                    <a href="#" data-category="Face Care">Face Care</a>
                </div>
            </div>
            <a href="/shop.html">Go to Shop</a>
        </div>
    </header>
    <div id="cart-total">Total: 0 hrn</div>
    <div id="basket-summary"></div>
    <div id="productContainer"></div>
    <button id="buyBtn">Buy for 0 hrn</button>
    <div id="pagination"></div>

    <script src="cart.js"></script>
</body>
</html>
